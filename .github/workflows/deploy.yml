name: deploy

on:
  push:
    branches: [main]
  # The kyber repo fires this when docs/product/ changes on its main branch,
  # so docs edits there go live here within minutes.
  repository_dispatch:
    types: [kyber-docs-updated]
  # Safety net: rebuild every 6 hours in case a dispatch is missed.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: kinetic-object-322814
          target: kyber-voget-io
          channelId: live
